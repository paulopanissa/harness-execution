name: Bug report
description: Something in HX does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran, what you expected, what you got. Paste the exact error.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. python3 ~/.hx/scripts/sync.py
        2. ...
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Agent CLI
      options: [Claude Code, Codex CLI, Both]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, shell, Python version, HX version (cat ~/.hx/VERSION)
      placeholder: Windows 11 + Git Bash, Python 3.12, HX 0.2.0
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, internal URLs, company names and personal paths from this report
          required: true
