name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: for f in hooks/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: Python compile
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Tests
        run: python -m unittest discover -s tests -t tests -v
